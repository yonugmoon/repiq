<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>RepiQ 현장수집 · 도면-설비 연동 DB 현행화</title>
<style>
:root{
  --bg:#0b1220; --panel:#111a2e; --panel-2:#0e1626; --line:#1e2b45;
  --ink:#e8edf7; --ink-dim:#9fb0cc; --ink-faint:#64748b;
  --brand:#3bd6c6; --brand-2:#2a9df4; --warn:#f4b740; --bad:#f4685f; --good:#4ad991;
  --chip:#16233c; --shadow:0 8px 30px rgba(0,0,0,.35);
  --r:14px; --r-sm:10px;
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
body{padding-bottom:78px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.mono{font-family:var(--mono)}

/* ---- Top bar ---- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d1526,#0b1220);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo .dot{width:11px;height:11px;border-radius:3px;background:conic-gradient(from 210deg,var(--brand),var(--brand-2));box-shadow:0 0 14px var(--brand)}
.logo small{font-weight:600;color:var(--ink-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.bar .site{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-dim);max-width:46vw}
.bar .site b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-pill{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.key-pill.ok{color:var(--good);border-color:#1c3d33}
.key-pill.no{color:var(--warn);border-color:#3d341c}

/* ---- Layout ---- */
main{max-width:820px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.card-h .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--chip);color:var(--brand);font-family:var(--mono)}
.card-h h2{font-size:15.5px}
.card-h .sub{margin-left:auto;font-size:12px;color:var(--ink-dim)}
.card-b{padding:15px}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 15px;border-radius:var(--r-sm);font-weight:600;font-size:14px;background:var(--chip);border:1px solid var(--line);color:var(--ink);transition:.12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--brand),#22b3a5);color:#04201d;border-color:transparent;box-shadow:0 4px 14px rgba(59,214,198,.28)}
.btn.blue{background:linear-gradient(180deg,var(--brand-2),#1e83d6);color:#031627;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:#3d2020}
.btn:disabled{opacity:.4;pointer-events:none}
.btn .sp{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row.tight{gap:7px}

/* ---- Fields ---- */
label.fld{display:block;margin-bottom:11px}
label.fld > span{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;font-weight:600}
.inp,select.inp,textarea.inp{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand-2)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ---- Chips / categories ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;transition:.1s}
.chip.on{background:var(--chip);border-color:var(--brand);color:var(--ink)}
.chip.on .k{color:var(--brand)}
.chip .k{font-family:var(--mono);font-size:10.5px;opacity:.8}
.chip .c{background:var(--brand);color:#04201d;border-radius:11px;font-size:10.5px;font-weight:800;padding:1px 6px;min-width:16px;text-align:center}

/* ---- Photo tiles ---- */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:12px}
.shot{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--panel-2);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .tag{position:absolute;left:0;bottom:0;right:0;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent);padding:14px 6px 5px;font-size:10px;font-weight:600;line-height:1.2}
.shot .tag .t{color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .tag .s{color:var(--brand);font-family:var(--mono);font-size:9px}
.shot .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;background:rgba(6,10,20,.75);color:#fff;font-size:13px;display:grid;place-items:center;line-height:1}
.shot .st{position:absolute;top:4px;left:4px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.shot.plan{border-style:dashed;border-color:var(--brand-2)}
.shot.add{border-style:dashed;display:grid;place-items:center;color:var(--ink-dim);font-size:12px;text-align:center;gap:4px;cursor:pointer}
.shot.add .plus{font-size:24px;line-height:1;color:var(--brand)}
.st.q0{background:var(--ink-faint)} .st.q1{background:var(--warn)} .st.q2{background:var(--good)} .st.qx{background:var(--bad)}

/* ---- AI result ---- */
.link-row{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);margin-bottom:9px;align-items:flex-start}
.link-row .lp{width:52px;height:52px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--chip)}
.link-row .meta{flex:1;min-width:0}
.link-row .meta .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.link-row .meta .kv{font-size:12px;color:var(--ink-dim);margin-top:3px;font-family:var(--mono)}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;letter-spacing:.02em}
.badge.match{background:#12332b;color:var(--good)}
.badge.new{background:#123047;color:var(--brand-2)}
.badge.miss{background:#3a2320;color:var(--bad)}
.badge.chk{background:#3a331a;color:var(--warn)}
.conf{height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.conf i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

/* ---- Empty / hint ---- */
.empty{padding:26px 16px;text-align:center;color:var(--ink-dim);font-size:13.5px}
.empty .ic{font-size:30px;margin-bottom:8px;opacity:.5}
.hint{font-size:12px;color:var(--ink-faint);margin-top:8px;line-height:1.5}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---- Stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.stats .s{background:var(--panel-2);padding:11px 6px;text-align:center}
.stats .s b{display:block;font-size:20px;font-weight:800;font-family:var(--mono)}
.stats .s span{font-size:10.5px;color:var(--ink-dim)}
.stats .s.g b{color:var(--good)} .stats .s.b b{color:var(--brand-2)} .stats .s.w b{color:var(--warn)} .stats .s.r b{color:var(--bad)}

/* ---- Bottom nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:rgba(11,18,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:10px;color:var(--ink-faint);font-size:10.5px;font-weight:600}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--brand)}
nav button.on .ni{filter:drop-shadow(0 0 8px var(--brand))}
nav button .bdg{position:absolute;transform:translate(14px,-4px);background:var(--bad);color:#fff;font-size:9px;font-weight:800;border-radius:10px;padding:0 5px;min-width:15px;text-align:center}

/* ---- Sheet / modal ---- */
.scrim{position:fixed;inset:0;background:rgba(4,8,16,.6);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:.26s cubic-bezier(.3,.9,.3,1);max-height:88vh;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grip{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 3px}
.sheet .sh-h{display:flex;align-items:center;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .sh-h h3{font-size:16px}
.sheet .sh-h .x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:16px}
.sheet .sh-b{padding:15px 16px;overflow-y:auto}
.pages{display:none}
.pages.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2740;border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transition:.24s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:#1c3d33;color:var(--good)}
.toast.bad{border-color:#3d2020;color:var(--bad)}

.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-dim)}
.seg button.on{background:var(--chip);color:var(--ink)}

.note{font-size:12px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);line-height:1.55}
.note b{color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;background:var(--chip);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><span class="dot"></span>RepiQ<small>현장수집</small></div>
    <div class="site">
      <b id="siteLabel">사업장 미선택</b>
      <span class="key-pill no" id="keyPill" onclick="ui.openSheet('settings')">API 키 없음</span>
    </div>
  </div>
</header>

<main>
  <!-- ===== 1. 수집 (Collect) ===== -->
  <section class="pages on" id="page-collect"></section>
  <!-- ===== 2. 연동 (Link/AI) ===== -->
  <section class="pages" id="page-link"></section>
  <!-- ===== 3. 대장 (DB) ===== -->
  <section class="pages" id="page-db"></section>
</main>

<nav>
  <button class="on" data-tab="collect" onclick="ui.tab('collect')"><span class="ni">📷</span>수집</button>
  <button data-tab="link" onclick="ui.tab('link')"><span class="ni">🔗</span>AI 연동<span class="bdg" id="linkBadge" style="display:none">0</span></button>
  <button data-tab="db" onclick="ui.tab('db')"><span class="ni">🗂️</span>대장·현행화</button>
</nav>

<!-- Sheet -->
<div class="scrim" id="scrim" onclick="ui.closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sh-h"><h3 id="sheetTitle">제목</h3><button class="x" onclick="ui.closeSheet()">✕</button></div>
  <div class="sh-b" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="filePlan" accept="image/*" capture="environment" hidden>
<input type="file" id="fileEquip" accept="image/*" capture="environment" hidden multiple>
<input type="file" id="fileImport" accept="application/json" hidden>

<script>
/* ============================================================
   RepiQ 현장수집 · 데이터 모듈
   - 34종 정보통신설비 장비 분류 (TTA K-10.0303 / 과기정통부 고시 기준)
   - AI(Gemini Vision) 프롬프트 정의
   - kb-core 연동을 위한 보정 규칙 스텁
   ============================================================ */

/* 34종 장비 분류.
   code : 대장/파일 식별용 짧은 키
   name : 화면 표기명
   group: 분류(구내통신/방송공동수신/구내방송/전송/전원/기타)
   fields: AI가 사진에서 추출을 시도할 핵심 규격 항목
   planSym: 도면에서 찾을 대표 심볼/약어 힌트                        */
const EQUIP_CATS = [
  // ── 구내통신선로설비 ──
  {code:"MDF",   name:"국선단자함(MDF)",       group:"구내통신", fields:["제조사","모델명","단자수","설치위치"], planSym:["MDF","국선단자함"]},
  {code:"IDF",   name:"층단자함(IDF/TPS)",     group:"구내통신", fields:["제조사","모델명","단자수","층/구역"], planSym:["IDF","TPS","층단자함"]},
  {code:"CABLE", name:"구내통신케이블",         group:"구내통신", fields:["종류(UTP/광/동)","규격(Cat6 등)","가닥/코어수","모델명"], planSym:["UTP","F/O","광","동"]},
  {code:"CONDUIT",name:"배관·배선(전선관/트레이)",group:"구내통신", fields:["종류(EMT/PVC/트레이)","규격(mm)","경로"], planSym:["EMT","트레이","전선관","PB"]},
  {code:"PULLBOX",name:"풀박스·접속함",         group:"구내통신", fields:["규격(mm)","재질","설치위치"], planSym:["PB","풀박스","접속함"]},
  {code:"OUTLET",name:"세대·구내 단자(정보인출구)",group:"구내통신", fields:["형식(RJ45/광)","제조사","포트수"], planSym:["TO","인출구","콘센트"]},
  {code:"WORKSP",name:"세대단자함·세대통신함",   group:"구내통신", fields:["제조사","모델명","규격","설치위치"], planSym:["세대단자함","통신함"]},
  {code:"ONU",   name:"광선로종단장치(ONU/광함체)",group:"구내통신", fields:["제조사","모델명","포트/코어수"], planSym:["ONU","광함체","FDF"]},
  {code:"FDF",   name:"광분배함(FDF/광단자함)",  group:"구내통신", fields:["제조사","모델명","코어수","어댑터형식"], planSym:["FDF","광분배","ODF"]},
  // ── 이동통신 구내선로설비 ──
  {code:"INBLD", name:"이동통신 구내중계설비",   group:"구내통신", fields:["사업자","장비명","안테나수"], planSym:["중계기","안테나","IBS"]},
  {code:"ANT",   name:"안테나·급전선",           group:"구내통신", fields:["형식","제조사","설치위치"], planSym:["안테나","ANT","급전선"]},
  // ── 방송공동수신설비 ──
  {code:"HEADEND",name:"방송공동수신 헤드엔드",  group:"방송수신", fields:["제조사","모델명","채널수"], planSym:["헤드엔드","증폭기"]},
  {code:"AMP",   name:"증폭기·분배기·분기기",    group:"방송수신", fields:["형식","제조사","규격(dB)"], planSym:["AMP","분배기","분기기"]},
  {code:"TAP",   name:"직렬단자(TAP)·세대단자",  group:"방송수신", fields:["형식","제조사","분배수"], planSym:["TAP","직렬단자"]},
  {code:"SATANT",name:"위성·지상파 안테나",      group:"방송수신", fields:["형식","제조사","규격"], planSym:["위성","안테나","파라볼라"]},
  {code:"COAX",  name:"동축케이블(방송)",        group:"방송수신", fields:["규격","제조사","경로"], planSym:["동축","COAX","HFBT"]},
  // ── 구내방송설비 ──
  {code:"PAAMP", name:"방송용 앰프·매트릭스",    group:"구내방송", fields:["제조사","모델명","출력(W)","존수"], planSym:["앰프","AMP","방송장비"]},
  {code:"SPK",   name:"스피커(구내방송)",        group:"구내방송", fields:["형식","제조사","출력(W)"], planSym:["SP","스피커","SPK"]},
  {code:"MIC",   name:"방송 입력·마이크·소스",   group:"구내방송", fields:["형식","제조사","채널"], planSym:["MIC","입력장치"]},
  // ── 전송·통신망 ──
  {code:"SW",    name:"L2/L3 스위치·허브",       group:"전송", fields:["제조사","모델명","포트수","PoE여부"], planSym:["SW","스위치","HUB"]},
  {code:"ROUTER",name:"라우터·게이트웨이",       group:"전송", fields:["제조사","모델명","회선"], planSym:["R","라우터","GW"]},
  {code:"OLT",   name:"OLT/광가입자망장치",      group:"전송", fields:["제조사","모델명","포트수"], planSym:["OLT","광가입자"]},
  {code:"RACK",  name:"통신랙·서버랙",           group:"전송", fields:["규격(U)","제조사","설치수량"], planSym:["RACK","랙","캐비닛"]},

/* ---------- IndexedDB (사진 blob 저장) ---------- */
const DB = {
  _db:null,
  open(){ return new Promise((res,rej)=>{
    if(this._db) return res(this._db);
    const r=indexedDB.open("repiq_field",1);
    r.onupgradeneeded=e=>{ const db=e.target.result;
      if(!db.objectStoreNames.contains("photos")) db.createObjectStore("photos"); };
    r.onsuccess=e=>{ this._db=e.target.result; res(this._db); };
    r.onerror=e=>rej(e.target.error);
  });},
  async put(id, blob){ const db=await this.open(); return new Promise((res,rej)=>{
    const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(blob,id);
    tx.oncomplete=()=>res(id); tx.onerror=e=>rej(e.target.error); });},
  async get(id){ const db=await this.open(); return new Promise((res,rej)=>{
    const tx=db.transaction("photos","readonly"); const rq=tx.objectStore("photos").get(id);
    rq.onsuccess=()=>res(rq.result); rq.onerror=e=>rej(e.target.error); });},
  async del(id){ const db=await this.open(); return new Promise((res)=>{
    const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").delete(id);
    tx.oncomplete=()=>res(); });}
};
const _urlCache={};
async function photoURL(id){
  if(_urlCache[id]) return _urlCache[id];
  const b=await DB.get(id); if(!b) return "";
  const u=URL.createObjectURL(b); _urlCache[id]=u; return u;
}

/* ---------- 이미지 리사이즈(업로드 전 축소) ---------- */
function resizeImage(file, max=1600, q=0.82){
  return new Promise((res)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b); },"image/jpeg",q);
    };
    img.onerror=()=>res(file);
    img.src=url;
  });
}
function blobToBase64(blob){ return new Promise((res)=>{ const r=new FileReader();
  r.onload=()=>res(r.result.split(",")[1]); r.readAsDataURL(blob); }); }

/* ---------- Gemini 호출 ---------- */
async function callGemini(prompt, imageBlobs){
  if(!S.apiKey) throw new Error("API 키가 없습니다. 우측 상단에서 등록하세요.");
  const parts=[{text:prompt}];
  for(const b of (imageBlobs||[])){
    parts.push({inline_data:{mime_type:"image/jpeg", data:await blobToBase64(b)}});
  }
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${S.model}:generateContent?key=${encodeURIComponent(S.apiKey)}`;
  const body={contents:[{role:"user",parts}],
    generationConfig:{temperature:0.1, maxOutputTokens:2048, responseMimeType:"application/json"}};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const t=await r.text(); throw new Error(`AI 오류 ${r.status}: ${t.slice(0,160)}`); }
  const j=await r.json();
  const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  return parseJSON(txt);
}
function parseJSON(txt){
  let t=(txt||"").trim().replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  try{ return JSON.parse(t); }catch(e){
    const m=t.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(_){} }
    throw new Error("AI 응답 파싱 실패");
  }
}

function renderCatList(){

    const chips=el("div","chips");
    EQUIP_CATS.filter(c=>c.group===g).forEach(c=>{

      chip.innerHTML=`<span class="k">${c.code}</span>${esc(c.name)}${n?`<span class="c">${n}</span>`:""}`;

function rosterSummary(){
  const sm={match:0,plan_only:0,field_new:0,mismatch:0};
  S.roster.forEach(r=>{ if(sm[r.status]!=null) sm[r.status]++; });
  return sm;
}
const STATUS_META={
  match:{c:"match",t:"일치"}, field_new:{c:"new",t:"신규"},
  mismatch:{c:"chk",t:"불일치"}, plan_only:{c:"miss",t:"현장확인"}
};
async function renderRosterList(box, list){
  if(!box) return; box.innerHTML="";
  if(!list.length){ box.innerHTML=`<div class="empty faint">해당 항목 없음</div>`; return; }
  for(const r of list){
    const cat=CAT_BY_CODE[r.code];
    const sm=STATUS_META[r.status]||{c:"match",t:r.status};
    const row=el("div","link-row");
    const photo = findPhotoForRoster(r);
    row.innerHTML=`
      <img class="lp" id="lp-${uid()}" alt="">
      <div class="meta">
        <div class="nm">${esc(r.name||cat?.name||r.code)} <span class="badge ${sm.c}">${sm.t}</span></div>
        <div class="kv">${esc(cat?.name||r.code)} · ${esc(r.loc||"위치미상")}</div>
        <div class="kv" style="color:var(--ink)">${esc(r.spec_final||"-")}</div>
        ${r.status==="mismatch"?`<div class="kv" style="color:var(--warn)">도면:${esc(r.spec_plan||"-")} ↔ 현장:${esc(r.spec_field||"-")}</div>`:""}
        ${r.action?`<div class="kv" style="color:var(--brand)">▸ ${esc(r.action)}</div>`:""}
        <div class="conf"><i style="width:${Math.round((r.confidence||0)*100)}%"></i></div>
      </div>`;
    box.appendChild(row);
    const imgEl=row.querySelector("img.lp");
    if(photo){ imgEl.src=await photoURL(photo); } else imgEl.style.display="none";
  }
}
function findPhotoForRoster(r){
  // 사진 참조 우선, 없으면 같은 code 첫 설비사진
  const byRef = S.equips.find(e=> e.ai && (e.ai.text_found && r.photoRef && e.ai.text_found.includes?.(r.photoRef)));
  if(byRef) return byRef.photoId;
  const byCode = S.equips.find(e=>e.code===r.code);
  return byCode?.photoId;
}

let pendingCat=null; // cat 시트에서 촬영 대기 정보

function setProg(txt){ const p=$("#aiProg"); if(p) p.innerHTML=txt; }

// ① 도면 해석
async function runPlanAI(){
  const targets=S.plans.filter(p=>!p.ai);
  if(!targets.length){ toast("해석할 도면 없음"); return; }
  const btn=$("#btnPlan"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 해석 중`; }
  let ok=0,fail=0;
  for(let i=0;i<targets.length;i++){
    const p=targets[i]; setProg(`도면 해석 ${i+1}/${targets.length} · ${esc(p.name||"")}`);
    try{
      const blob=await DB.get(p.photoId);
      let res=await callGemini(AI.planPrompt({site:S.site, planName:p.name}), [blob]);
      res=kbApply("plan", res);
      p.ai=res; p.parsedAt=now(); ok++; save();
    }catch(err){ fail++; setProg(`⚠️ ${esc(err.message)}`); }
  }
  save(); render();
  toast(`도면 해석 완료 · 성공 ${ok}${fail?` / 실패 ${fail}`:""}`, fail?"bad":"good");
}

// ② 설비 판독
async function runEquipAI(){
  const targets=S.equips.filter(e=>!e.ai);
  if(!targets.length){ toast("판독할 설비 없음"); return; }
  const btn=$("#btnEquip"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 판독 중`; }
  let ok=0,fail=0;
  for(let i=0;i<targets.length;i++){
    const e=targets[i]; const cat=CAT_BY_CODE[e.code];
    setProg(`설비 판독 ${i+1}/${targets.length} · ${esc(cat?.name||e.code)}`);
    try{
      const blob=await DB.get(e.photoId);
      let res=await callGemini(AI.equipPrompt(cat,{site:S.site, locNote:e.locNote}), [blob]);
      res=kbApply("equip", res);
      e.ai=res; e.readAt=now(); ok++; save();
    }catch(err){ fail++; setProg(`⚠️ ${esc(err.message)}`); }
  }
  save(); render();
  toast(`설비 판독 완료 · 성공 ${ok}${fail?` / 실패 ${fail}`:""}`, fail?"bad":"good");
}

// ③ 연동 매칭 → 최신 대장
async function runMatch(){
  const btn=$("#btnLink"); if(btn){ btn.disabled=true; btn.innerHTML=`<span class="sp"></span> 연동 중`; }
  setProg("도면·설비 대조 중…");
  // 도면 항목 취합
  const planItems=[];
  S.plans.forEach(p=>(p.ai?.items||[]).forEach(it=>planItems.push({...it, planName:p.name})));
  // 설비 판독 취합
  const equipReads=S.equips.filter(e=>e.ai).map(e=>({
    id:e.id, code:e.code, locNote:e.locNote,
    extracted:e.ai.extracted, text_found:e.ai.text_found, confidence:e.ai.confidence
  }));
  try{
    let res=await callGemini(AI.matchPrompt(planItems, equipReads, {site:S.site}), []);
    res=kbApply("match", res);
    S.roster=(res.roster||[]).map(r=>({...r}));
    S.linkedAt=now(); save(); render();
    toast(`연동 완료 · 대장 ${S.roster.length}건 생성`,"good");
    setProg("");
  }catch(err){
    // AI 매칭 실패 시 로컬 규칙 기반 폴백
    setProg("AI 매칭 실패 → 로컬 규칙으로 대장 생성");
    S.roster=localMatch(planItems, equipReads);
    S.linkedAt=now(); save(); render();
    toast(`로컬 연동으로 대장 ${S.roster.length}건 생성`,"bad");
  }
}

// AI 없이도 최소 동작: code 기준 병합
function localMatch(planItems, equipReads){
  const out=[]; const usedEquip=new Set();
  planItems.forEach(pi=>{
    const m=equipReads.find(e=>e.code===pi.code && !usedEquip.has(e.id));
    if(m){ usedEquip.add(m.id);
      const fSpec=Object.values(m.extracted||{}).filter(Boolean).join(" ");
      out.push({code:pi.code, name:pi.label||CAT_BY_CODE[pi.code]?.name, loc:pi.loc||m.locNote||"",
        spec_final:fSpec||pi.spec||"", spec_plan:pi.spec||"", spec_field:fSpec||"",
        status: fSpec&&pi.spec&&fSpec!==pi.spec?"mismatch":"match",
        action:"", confidence:m.confidence||0.5, photoRef:m.text_found||""});
    } else out.push({code:pi.code, name:pi.label||CAT_BY_CODE[pi.code]?.name, loc:pi.loc||"",
        spec_final:pi.spec||"", spec_plan:pi.spec||"", status:"plan_only",
        action:"현장 재확인", confidence:pi.confidence||0.4});
  });
  equipReads.forEach(e=>{ if(usedEquip.has(e.id)) return;
    const fSpec=Object.values(e.extracted||{}).filter(Boolean).join(" ");
    out.push({code:e.code, name:CAT_BY_CODE[e.code]?.name, loc:e.locNote||"",
      spec_final:fSpec, spec_field:fSpec, status:"field_new",
      action:"도면 미반영 신규", confidence:e.confidence||0.5, photoRef:e.text_found||""});
  });
  return out;
}

/* ============================================================
   삭제 핸들러
   ============================================================ */
async function delPlan(id){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  if(p.photoId){ await DB.del(p.photoId); delete _urlCache[p.photoId]; }
  S.plans=S.plans.filter(x=>x.id!==id); S.linkedAt=null; save(); render();
}
async function delEquip(id){
  const e=S.equips.find(x=>x.id===id); if(!e) return;
  if(e.photoId){ await DB.del(e.photoId); delete _urlCache[e.photoId]; }
  S.equips=S.equips.filter(x=>x.id!==id); S.linkedAt=null; save(); render();
}
window.delPlan=delPlan; window.delEquip=delEquip;

/* ============================================================
   파일 입력 핸들러 (도면/설비 촬영, 복원)
   ============================================================ */
$("#filePlan").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  toast("도면 저장 중…");
  const blob=await resizeImage(f, 1900, 0.85);
  const pid=uid("ph_"); await DB.put(pid, blob);
  S.plans.push({id:uid("pl_"), name:`도면 ${S.plans.length+1}`, photoId:pid, ai:null, addedAt:now()});
  S.linkedAt=null; save(); render(); toast("도면 추가됨","good");
});

$("#fileEquip").addEventListener("change", async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length||!pendingCat) return;
  const{code,locNote}=pendingCat; pendingCat=null;
  toast(`설비 ${files.length}장 저장 중…`);
  for(const f of files){
    const blob=await resizeImage(f, 1700, 0.85);
    const pid=uid("ph_"); await DB.put(pid, blob);
    S.equips.push({id:uid("eq_"), code, locNote, photoId:pid, ai:null, addedAt:now()});
  }
  S.linkedAt=null; save(); render();
  toast(`${CAT_BY_CODE[code]?.name} ${files.length}장 추가`,"good");
});

$("#fileImport").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!data._repiq) throw new Error("RepiQ 백업 파일이 아닙니다");
    const key=S.apiKey, model=S.model;
    S={...blankState(), ...data.state, apiKey:key, model:model};
    save(); render();
    toast("복원 완료(사진 원본은 기기별로 별도)","good");
  }catch(err){ toast("복원 실패: "+err.message,"bad"); }
});

/* ============================================================
   내보내기
   ============================================================ */
function exportCSV(){
  const head=["구분","장비코드","장비명","위치","최종규격","도면규격","현장규격","상태","조치","신뢰도"];
  const rows=S.roster.map(r=>[
    S.site, r.code, r.name||CAT_BY_CODE[r.code]?.name||"", r.loc||"",
    r.spec_final||"", r.spec_plan||"", r.spec_field||"",
    STATUS_META[r.status]?.t||r.status, r.action||"", Math.round((r.confidence||0)*100)+"%"
  ]);
  const csv=[head,...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  download(blob, `RepiQ_설비대장_${S.site||"현장"}_${dstamp()}.csv`);
  toast("CSV 내보냄","good");
}
function exportJSON(){
  const state={...S}; delete state.apiKey;
  const blob=new Blob([JSON.stringify({_repiq:1, version:1, exportedAt:now(), state},null,1)],{type:"application/json"});
  download(blob, `RepiQ_백업_${S.site||"현장"}_${dstamp()}.json`);
  toast("백업 저장됨","good");
}
function download(blob, name){
  const u=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function dstamp(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`; }
window.exportCSV=exportCSV; window.exportJSON=exportJSON;
window.runPlanAI=runPlanAI; window.runEquipAI=runEquipAI; window.runMatch=runMatch;
